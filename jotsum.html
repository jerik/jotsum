<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>jotsum</title>
    <style>
      /* Seitenleiste/Schublade: die Seite bleibt auch im Dark Mode hell,
         daher wechseln dort nur Akzent, Grau und Linien (siehe unten). */
      :root {
        --header-h: 61px;
        --side-w: 260px;
        --side-bg: #ffffff;
        --side-text: #1f2328;
        --side-muted: #6e7781;
        --side-border: #d0d7de;
        --side-hover: #f6f8fa;
        --side-active-bg: #fffbe6;
        --side-accent: #1f883d;
        --side-danger: #cf222e;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      html {
        /* Fokussierte Zeilen nicht unter den Sticky-Header scrollen */
        scroll-padding-top: calc(var(--header-h) + env(safe-area-inset-top) + 8px);
      }

      /* Header */
      .site-header {
        position: sticky; top: 0; z-index: 30;
        background: #fff; border-bottom: 1px solid #d0d7de;
        padding-top: env(safe-area-inset-top);
      }
      .wrap {
        max-width: 1040px; margin: 0 auto;
        padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
        min-height: 44px;
        display: flex; align-items: center; gap: 12px;
      }
      .brand { font: 600 18px/1.2 inherit; margin: 0; }
      .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
      .btn {
        border: 1px solid #d0d7de; background: transparent;
        padding: 6px 10px; border-radius: 6px; font: 500 14px inherit;
        min-height: 44px;
        cursor: pointer;
      }

      /* Icon-Knöpfe: mindestens 44×44 px Touch-Ziel */
      .icon-btn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 44px; height: 44px; padding: 0; flex: none;
        border: 1px solid transparent; border-radius: 6px;
        background: transparent; color: var(--side-text);
        cursor: pointer;
      }
      .icon-btn:hover { background: var(--side-hover); border-color: var(--side-border); }
      .icon-btn svg { width: 22px; height: 22px; }
      .btn:focus-visible,
      .icon-btn:focus-visible,
      .shortsave-open:focus-visible,
      .shortsave-delete:focus-visible,
      .sidebar-title:focus-visible {
        outline: 2px solid var(--side-accent);
        outline-offset: 2px;
      }
      .btn:hover { background: #f6f8fa; }
      .btn-primary { background: #1f883d; border-color: #1f883d; color:#fff; }
      .btn-primary:hover { background:#1a7f37; }
      a.btn { color: inherit; text-decoration: none; }

	  /* Grid / Layout – robust, auch in Safari */
	  jo-sheet, jo-lastline {
	    display: grid;
	  
	    /* Links: Text (1fr). Rechts: Summe (breite genug für Zahlen). */
	    grid-template-columns: 1fr minmax(8ch, 14ch);
	    column-gap: 12px;
	  
	    max-width: 1040px;
	    margin: 20px auto 0;
	    padding: 0 16px;
	  }
	  jo-lastline { margin-top: 0; }
	  
	  /* explizit auf Spalten pinnen – verhindert „Umklappen“ */
	  jo-line     { grid-column: 1; }
	  jo-sum      { grid-column: 2; }
	  jo-spacer   { grid-column: 1; }
	  jo-total    { grid-column: 2; }
	  
	  /* Mobile: Summe etwas schmaler, damit’s immer passt */
	  @media (max-width: 600px) {
	    .wrap { padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); }
	    jo-sheet, jo-lastline {
	  	grid-template-columns: 1fr minmax(6ch, 12ch);
	  	column-gap: 8px;
	    }
	  }

      /* Typo & Zeilen */
      jo-line, jo-sum, jo-total {
        font-size: 18px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        padding: 7px;
      }

      jo-line {
        background: #f7f7f7;
        border-bottom: 1px solid #ffffff; /* weiße Trennlinie zwischen Zeilen */
        text-align: left;
      }
      jo-sum {
        background: #ffffff;
        border-bottom: 1px solid #ffffff; /* gleiche Trennlinie rechts */
        text-align: right;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      jo-spacer { 
        padding: 7px; 
        border-top: 1px solid #d0d7de; /* dein Abschlussstrich */
      }
      jo-total {
        background: #ffffff;
        text-align: right;
        font-weight: bold;
        border-top: 1px solid #d0d7de; /* passend zum Spacer */
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

	  /* Aktive Zeile: sehr dezentes Highlight + schmale Akzentleiste links */
	  jo-line.is-active {
	    background-color: #fffbe6;             /* heller als vorher */
	    position: relative;
	  }
	  jo-line.is-active::before {
	    content: "";
	    position: absolute;
	    left: 0; top: 0; bottom: 0;
	    width: 3px;
	    background: #d0d7de;                   /* GitHub-Grau als Akzent */
	  }
	  jo-line:focus { outline: none; }

	  jo-line.is-heading {
	    font-size: 1.2em;
	    font-weight: bold;
	  }
	  jo-line.is-heading + jo-sum {
	    visibility: hidden;
	  }

	  /* Variablen & Zwischensummen */
	  jo-sum.is-muted {
	    color: #6e7781; /* gedimmt, passend zum Footer */
	  }
	  jo-line.is-definition {
	    font-style: italic;
	    color: #6e7781;
	  }
	  jo-line.is-separator,
	  jo-line.is-separator + jo-sum {
	    border-top: 1px solid #d0d7de; /* feine Trennlinie, wie bei jo-spacer/jo-total */
	  }
	  jo-line.is-separator + jo-sum {
	    font-weight: bold;
	  }

	  /* Beispiel-Hinweis auf dem leeren Blatt: nur Optik, kein Inhalt.
	     ::after, weil ::before bereits der Akzentstreifen ist. */
	  jo-line.is-placeholder {
	    position: relative;
	  }
	  jo-line.is-placeholder::after {
	    content: attr(data-placeholder);
	    color: #8c959f;
	    pointer-events: none;
	  }
	  jo-sum.is-placeholder,
	  jo-total.is-placeholder {
	    color: #8c959f;
	    font-weight: normal;
	  }

	  /* Fehlerhafte Zeilen: roter Akzentstreifen links, analog zur aktiven Zeile.
	     Bewusst KEINE Unterstreichung - die waere von den roten Wellenlinien
	     der Browser-Rechtschreibpruefung nicht zu unterscheiden. */
	  jo-line.is-error {
	    position: relative;
	  }
	  jo-line.is-error::before {
	    content: "";
	    position: absolute;
	    left: 0; top: 0; bottom: 0;
	    width: 3px;
	    background: #cf222e;
	  }
	  jo-sum.is-error {
	    color: #cf222e;
	    text-align: right;
	    cursor: help;   /* zeigt, dass am ? eine Erklaerung haengt */
	  }

	  /* Dark Mode: noch dezenteres Highlight + etwas dunklere Akzentleiste */
	  @media (prefers-color-scheme: dark){
	    jo-line.is-active {
	  	  background-color: rgba(255, 251, 230, 0.10);  /* zartes Gelb, transparent */
	    }
	    jo-line.is-active::before {
	  	  background: #6e7781;                 /* Muted Grey im Dark Mode */
	    }
      /* jo-line:focus { outline: none; } */

	    jo-sum.is-muted {
	      color: #8b949e; /* etwas heller, damit es im Dark Mode lesbar bleibt */
	    }
	    jo-line.is-definition {
	      color: #8b949e;
	    }
	    jo-line.is-separator,
	    jo-line.is-separator + jo-sum {
	      border-top-color: #30363d;
	    }

	    jo-line.is-placeholder::after,
	    jo-sum.is-placeholder,
	    jo-total.is-placeholder {
	      color: #6e7781;
	    }

	    jo-line.is-error::before {
	      background: #ff7b72;
	    }
	    jo-sum.is-error {
	      color: #ff7b72;
	    }
	  }


      /* Mobile */
      @media (max-width: 600px) {
		.wrap { padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); gap: 8px; }
		.brand { font-size: 16px; }            /* vorher 18px */
		.btn { padding: 5px 8px; font-size: 13px; }

        /* Summe bleibt kompakt; Text bekommt den restlichen Platz */
        jo-sheet, jo-lastline {
          grid-template-columns: 1fr minmax(6ch, fit-content(12ch));
          column-gap: 8px;
        }
      }

      /* Layout: Seitenleiste + Blatt */
      .layout { display: block; }
      .content { min-width: 0; padding-right: env(safe-area-inset-right); }

      .sidebar {
        box-sizing: border-box;
        background: var(--side-bg); color: var(--side-text);
        border-right: 1px solid var(--side-border);
        overflow-y: auto; overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .sidebar-title {
        margin: 0; padding: 14px 16px 8px;
        font-size: 13px; font-weight: 600; letter-spacing: .02em;
        text-transform: uppercase; color: var(--side-muted);
      }
      .sidebar-title:focus { outline: none; }
      .sidebar-empty {
        margin: 0; padding: 4px 16px 16px;
        font-size: 14px; color: var(--side-muted);
      }
      .shortsave-list { list-style: none; margin: 0; padding: 0 0 16px; }
      .shortsave {
        display: flex; align-items: stretch;
        border-left: 4px solid transparent;
      }
      .shortsave:hover { background: var(--side-hover); }
      .shortsave-open {
        flex: 1; min-width: 0; min-height: 44px;
        display: flex; align-items: center; gap: 8px;
        padding: 8px 8px 8px 12px; margin: 0;
        border: 0; background: transparent; color: inherit;
        font: inherit; font-size: 15px; text-align: left;
        white-space: nowrap; overflow: hidden;
        cursor: pointer;
      }
      /* Name wird gekürzt, die Summe bleibt immer ganz sichtbar (Seitenleiste und Schublade) */
      .shortsave-name {
        flex: 1 1 auto; min-width: 0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .shortsave-total {
        flex-shrink: 0; margin-left: auto;
        white-space: nowrap; text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--side-text);
      }
      .shortsave-delete {
        flex: none; width: 44px; min-height: 44px;
        display: inline-flex; align-items: center; justify-content: center;
        margin: 0; padding: 0; border: 0; background: transparent;
        color: var(--side-muted); cursor: pointer;
      }
      .shortsave-delete svg { width: 18px; height: 18px; }
      .shortsave-delete:hover { color: var(--side-danger); }
      .shortsave-open:focus-visible,
      .shortsave-delete:focus-visible { outline-offset: -2px; }

      /* Aktives Blatt: Akzentleiste links + Hintergrund + fett (nicht nur Farbe) */
      .shortsave.is-active {
        background: var(--side-active-bg);
        border-left-color: var(--side-accent);
      }
      .shortsave.is-active .shortsave-open { font-weight: 600; }

      .drawer-backdrop { display: none; }

      /* Ab 900 px: Seitenleiste dauerhaft neben dem Blatt */
      @media (min-width: 900px) {
        .drawer-toggle { display: none; }
        .layout {
          display: grid;
          grid-template-columns: var(--side-w) minmax(0, 1fr);
          align-items: start;
        }
        .sidebar {
          position: sticky;
          top: calc(var(--header-h) + env(safe-area-inset-top));
          height: calc(100vh - var(--header-h) - env(safe-area-inset-top));
          padding-left: env(safe-area-inset-left);
        }
      }

      /* Unter 900 px: Schublade von links, unterhalb des Headers */
      @media (max-width: 899.98px) {
        .content { padding-left: env(safe-area-inset-left); }
        .sidebar {
          position: fixed; z-index: 20; left: 0;
          top: calc(var(--header-h) + env(safe-area-inset-top));
          bottom: 0;
          width: min(85vw, 320px);
          padding-left: env(safe-area-inset-left);
          padding-bottom: env(safe-area-inset-bottom);
          box-shadow: 0 8px 24px rgba(31, 35, 40, .2);
          transform: translateX(-105%);
          visibility: hidden;
          transition: transform .2s ease, visibility 0s linear .2s;
        }
        body.drawer-open .sidebar {
          transform: none;
          visibility: visible;
          transition: transform .2s ease;
        }
        body.drawer-open .drawer-backdrop {
          display: block;
          position: fixed; z-index: 15; left: 0; right: 0; bottom: 0;
          top: calc(var(--header-h) + env(safe-area-inset-top));
          background: rgba(31, 35, 40, .3);
        }
        /* Hintergrund nicht mitscrollen, solange die Schublade offen ist */
        body.drawer-open { overflow: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sidebar { transition: none !important; }
      }

      /* Dark Mode: die Seite bleibt hell; nur Akzent, Grau und Linien wechseln
         wie im Block oben. Die dort genutzten helleren Töne (#8b949e, #ff7b72)
         erreichen auf Weiß keinen ausreichenden Kontrast, daher hier dunklere. */
      @media (prefers-color-scheme: dark) {
        :root {
          --side-muted: #57606a;
          --side-border: #30363d;
          --side-accent: #1a7f37;
          --side-danger: #a40e26;
        }
      }

      /* Footer */
      footer {
        max-width: 1040px; margin: 40px auto; padding: 0 16px env(safe-area-inset-bottom);
        text-align: center; font-size: 13px; color: #6e7781;
      }
      footer a { color: inherit; }
      #version {
        display: block; margin-bottom: 8px; font-size: 12px; color: #6e7781;
		padding-top: 20px; 
      }
    </style>
    <script type="text/javascript" src="./jotsum.js" charset="utf-8"></script>
  </head>
  <body>
    <!-- Header -->
    <header class="site-header">
      <div class="wrap">
        <button type="button" id="drawer-toggle" class="icon-btn drawer-toggle"
                aria-label="Saved sheets" title="Saved sheets"
                aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="brand">JotSum</h1>
        <nav id="header-actions" class="actions">
          <!--a class="btn" href="https://github.com/jerik/jotsum" target="_blank">Repository</a-->
          <button class="btn btn-primary" onclick="add_calc_line()">Add line</button>
          <button type="button" id="new-sheet" class="icon-btn" aria-label="New page" title="New page">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg>
          </button>
        </nav>
      </div>
    </header>

    <div class="layout">
      <!-- Shortsaves: Seitenleiste ab 900 px, darunter Schublade -->
      <aside id="sidebar" class="sidebar" aria-labelledby="sidebar-title">
        <h2 id="sidebar-title" class="sidebar-title" tabindex="-1">Saved sheets</h2>
        <ul id="shortsave-list" class="shortsave-list"></ul>
        <p id="shortsave-empty" class="sidebar-empty">Nothing saved yet. Sheets save automatically while you type.</p>
      </aside>
      <div id="drawer-backdrop" class="drawer-backdrop"></div>

      <main id="content" class="content">
        <!-- Sheet -->
        <jo-sheet id="sheet">
        </jo-sheet>
        <jo-lastline>
          <jo-spacer></jo-spacer>
          <jo-total id="total"></jo-total>
        </jo-lastline>

        <!-- Footer -->
        <footer>
		Use the operators + - * / ( ) <br/> Download for offline use • Source and docs on <a href="https://github.com/jerik/jotsum">GitHub</a>
          <span id="version"></span>
        </footer>
      </main>
    </div>
  </body>
</html>
